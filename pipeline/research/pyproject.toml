[project]
name = "voltia-research"
version = "0.0.0"
description = "Model experiments for VoltIA. Not part of the daily pipeline or CI."
requires-python = ">=3.12,<3.13"
dependencies = [
  "voltia-pipeline",
  "xgboost>=2.1",
  "catboost>=1.2",
  "optuna>=4.0",
  "quantile-forest>=1.4",
  "statsforecast>=2.0",
  "pytest>=8.3",
]

[tool.uv.sources]
voltia-pipeline = { path = "..", editable = true }

[tool.pytest.ini_options]
addopts = "--no-cov"
