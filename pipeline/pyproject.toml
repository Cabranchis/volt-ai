[project]
name = "voltia-pipeline"
version = "0.1.0"
description = "Data ingestion, forecasting and anomaly detection pipeline for VoltIA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "tenacity>=9.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "pandera>=0.20",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "shap>=0.46",
  "holidays>=0.58",
  "typer>=0.12",
  "structlog>=24.4",
  "google-genai>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
]

[project.scripts]
voltia = "voltia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voltia"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL", "RUF", "S", "N", "PT", "DTZ"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pandera.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["shap.*", "lightgbm.*", "statsmodels.*", "holidays.*", "sklearn.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=voltia --cov-report=term-missing"
markers = ["network: test that needs internet (skipped in CI)"]

[tool.coverage.report]
fail_under = 80
