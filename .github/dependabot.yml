version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The research environment (torch from the CUDA index) is never deployed and Dependabot cannot
  # resolve that index, so its updates would only fail. Keep it current by hand.
  - package-ecosystem: uv
    directory: /pipeline/research
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
