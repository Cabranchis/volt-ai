name: Daily pipeline

# 06:30 in Bogotá. XM publishes the previous day's settled values overnight.
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Reload the full history first (slow; use after creating the database)"
        type: boolean
        default: false

permissions:
  contents: read

# Two runs writing the same tables would only waste quota; queue instead of overlapping.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    name: Ingest, forecast, detect anomalies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pipeline
    env:
      # The write-capable URL lives only here; the web app gets the read-only one on Vercel.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the database secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL is not set. See docs/deployment.md, step 2."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Install from the lockfile only
        run: uv sync --frozen --no-dev
      - name: Migrate
        run: uv run voltia migrate
      - name: Full history (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill }}
        run: uv run voltia backfill
      - name: Ingest what is new
        run: uv run voltia update
      - name: Train, backtest and forecast
        run: uv run voltia train --predict
      - name: Detect anomalies
        run: uv run voltia anomalies
      - name: Status
        if: always()
        run: uv run voltia status
      - name: Daily briefing (template if there is no Gemini key)
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: uv run voltia brief
