name: Watchdog

# Tells the owner when the platform needs attention, instead of waiting for someone to notice.
#
# - Every day, after the morning pipeline run, it reads /api/v1/health. A status that is not `ok`
#   (a dataset failed, or the data or the forecast is older than the pipeline leaves it) opens one
#   issue, which GitHub emails; later checks add a comment to it, and it closes itself on recovery.
# - When the daily pipeline run fails (for example the publication gate refused a bad forecast) or
#   reaches its time limit (GitHub calls that `cancelled`), it opens or updates a second issue with
#   the link to the run.
#
# It only reads a public URL and writes issues. It never checks out code and never sees a secret, so
# the permissions below are all it has. It does not replace an external monitor: GitHub disables
# scheduled workflows in a repository with no activity for 60 days (docs/runbook.md, "Watchdog").
on:
  schedule:
    - cron: "45 13 * * *" # 08:45 in Bogotá, after the 06:30 pipeline run has finished
  workflow_run:
    workflows: ["Daily pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SITE_URL: ${{ vars.SITE_URL || 'https://voltia-xi-five.vercel.app' }}
  LABEL: watchdog

jobs:
  health:
    name: Platform health
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: watchdog-health
      cancel-in-progress: false
    steps:
      - name: Read the health endpoint (twice, ten minutes apart, so a run that is finishing is not reported)
        id: read
        run: |
          read_health() { curl -fsS --max-time 30 "$SITE_URL/api/v1/health?x=$RANDOM" 2>/dev/null || echo '{}'; }
          status_of() { jq -r '.status // "unreachable"' <<<"$1" 2>/dev/null || echo unreachable; }
          body=$(read_health)
          status=$(status_of "$body")
          if [ "$status" != "ok" ]; then
            sleep 600
            body=$(read_health)
            status=$(status_of "$body")
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          jq -r '"Status: \(.status // "unreachable")",
                 "Reasons: \((.reasons // []) | join(", "))",
                 "Age in days of the data, the model and the forecast: \(.ages.dataDays // "?"), \(.ages.modelDays // "?"), \(.ages.forecastDays // "?")"' \
            <<<"$body" > health.txt 2>/dev/null || echo "Status: unreachable" > health.txt
          cat health.txt
      - name: Open, update or close the issue
        env:
          STATUS: ${{ steps.read.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Platform: the health check is not ok"
          gh label create "$LABEL" --color B97400 --description "Raised by the watchdog workflow" --force >/dev/null
          number=$(gh issue list --label "$LABEL" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          {
            cat health.txt
            echo
            echo "Health: $SITE_URL/api/v1/health"
            echo "Checked by: $RUN_URL"
            echo
            echo "What to do is in docs/runbook.md (\"The site shows old data or an old forecast\")."
          } > body.md
          if [ "$STATUS" = "ok" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "The health check is ok again ($RUN_URL). Closing."
              gh issue close "$number"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --label "$LABEL" --body-file body.md
          fi
      - name: Read the live record (does the P10 to P90 band still cover what happened?)
        # Advice, not a health status: the site is fine while a band misses. `low` is a month of
        # settled days well under the nominal 80 % (limits in web/src/lib/live-watch.ts). It is `ok`
        # only when both targets are `ok`. Missing, unreadable or `insufficient` data is "unknown" and
        # changes nothing, so an old deployment, a blip or a gap in the outcomes does not open or
        # close an issue.
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Model: the live record is off target"
          body=$(curl -fsS --max-time 30 "$SITE_URL/api/v1/health?x=$RANDOM" 2>/dev/null || echo '{}')
          verdict=$(jq -r '[.liveRecord.demand.verdict, .liveRecord.price.verdict] as $s
            | if ($s | any(. == "low")) then "low"
              elif ($s | all(. == "ok")) then "ok"
              else "unknown" end' <<<"$body" 2>/dev/null || echo unknown)
          echo "live record: $verdict"
          jq -r '.liveRecord // {} | to_entries[] | "\(.key): \(.value.verdict), coverage \(.value.coverage // "n/a") over \(.value.scoredDays) settled days (\(.value.from) to \(.value.to))"' <<<"$body" 2>/dev/null || true
          [ "$verdict" = "unknown" ] && exit 0
          gh label create "$LABEL" --color B97400 --description "Raised by the watchdog workflow" --force >/dev/null
          number=$(gh issue list --label "$LABEL" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          {
            jq -r '.liveRecord | to_entries[] | "- \(.key): \(.value.verdict), mean share of forecasts inside P10 to P90 = \(.value.coverage // "n/a") over \(.value.scoredDays) settled days (\(.value.from) to \(.value.to))"' <<<"$body"
            echo
            echo "The band is built for 0.80. The alert fires below 0.55 averaged over the 28 days ending on the last settled day (days without a settled outcome are skipped; at least 21 are needed)."
            echo "Track record: $SITE_URL/en/models"
            echo "Checked by: $RUN_URL"
            echo
            echo "What to do is in docs/runbook.md (\"The live record is off target\")."
          } > live.md
          if [ "$verdict" = "ok" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "The live record is back inside its limits ($RUN_URL). Closing."
              gh issue close "$number"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body-file live.md
          else
            gh issue create --title "$title" --label "$LABEL" --body-file live.md
          fi

  pipeline:
    name: Pipeline run result
    if: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One group per run, so a result that arrives while another is being handled is not dropped.
    concurrency:
      group: watchdog-pipeline-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Open, update or close the issue
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          STARTED: ${{ github.event.workflow_run.run_started_at }}
          ENDED: ${{ github.event.workflow_run.updated_at }}
        run: |
          title="Pipeline: the daily run failed"
          # GitHub reports a job that reaches its time limit (45 minutes) as `cancelled`, the same
          # word as a run someone stopped by hand. A run that lasted at least 40 minutes is the
          # limit; a shorter one was stopped on purpose and is not reported.
          if [ "$CONCLUSION" = "cancelled" ]; then
            seconds=$(( $(date -d "$ENDED" +%s) - $(date -d "$STARTED" +%s) ))
            echo "cancelled after $seconds s"
            if [ "$seconds" -lt 2400 ]; then
              echo "Stopped by hand, not reported."
              exit 0
            fi
            CONCLUSION=timed_out
          fi
          gh label create "$LABEL" --color B97400 --description "Raised by the watchdog workflow" --force >/dev/null
          number=$(gh issue list --label "$LABEL" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "$CONCLUSION" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "The next run succeeded ($RUN_URL). Closing."
              gh issue close "$number"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            {
              echo "The daily pipeline run did not finish: $RUN_URL"
              echo
              echo "The site keeps showing the last good data and forecast, with their age."
              echo "A message that starts with \"publication gate\" in the log means the new forecast was refused on purpose."
              echo "What to do is in docs/runbook.md (\"The pipeline failed\")."
            } > body.md
            gh issue create --title "$title" --label "$LABEL" --body-file body.md
          fi
